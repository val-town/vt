name: Regenerate AGENTS.md

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Generate AGENTS.md
        run: deno run --allow-write=AGENTS.md --allow-env=DENO_DIR,DENO_NO_PROMPT scripts/generate-agents-md.ts

      - name: Format AGENTS.md
        run: deno fmt AGENTS.md

      - name: Check for changes
        id: changes
        run: |
          if git diff --exit-code AGENTS.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit AGENTS.md
        if: github.ref == 'refs/heads/main' && steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md
          git commit -m "chore: regenerate AGENTS.md from plugin skills" -m "[skip actions]"
          git push
